# Red Hat's PwnedAlert scanner reads only [allowlist] below; [extend] is for
# the local gitleaks pre-commit hook, which would otherwise run with no rules.
[extend]
  useDefault = true

[allowlist]
  description = "Global Allowlist"

  # Fake RTSP credentials in camera tests. Wyze's local RTSP firmware uses a
  # fixed "wyze" user and a user-chosen password; these fixtures are made up.
  regexes = [
    '''rtsps?:\/\/wyze:''',
  ]

  paths = [
    '''^tests\/''',
  ]
