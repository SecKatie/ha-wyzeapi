[project]
name = "ha-wyzeapi"
version = "0.1.40"
description = "A Home Assistant integration for Wyze devices"
authors = [{ name = "Katie Mulliken", email = "katie@mulliken.net" }]
license = { text = "Apache-2.0" }
# Development environment; the HACS minimum is declared in hacs.json.
requires-python = ">=3.14.2,<3.15"

dependencies = [
    "homeassistant>=2026.10.2",
    "wyzeapy>=0.8.0,<0.9.0",
    "websockets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_components"]

[dependency-groups]
dev = [
    # HA integration requirements needed by imports in the test environment.
    "aiohasupervisor==0.6.0",
    "aiousbwatcher==1.1.2",
    "habluetooth==7.1.2",
    "serialx==1.11.0",
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pyturbojpeg>=2.5.0",
    "ruff>=0.12.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
