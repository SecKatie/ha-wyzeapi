name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only run when SecKatie triggers it. Review events on fork PRs don't get
    # repo secrets, so skip them there (a top-level PR comment still works).
    if: |
      github.event.sender.login == 'SecKatie' && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit and push
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      # Same setup as pytest.yml so Claude can run tests and ruff
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # Extra tools on top of the action's defaults (file edits in the repo, Read/Grep/Glob,
          # git add/commit/push): web access, tests and ruff via uv, and read-only gh
          claude_args: |
            --allowedTools "WebFetch,WebSearch,Bash(uv sync),Bash(uv sync *),Bash(uv run pytest),Bash(uv run pytest *),Bash(uv run ruff check),Bash(uv run ruff check *),Bash(uv run ruff format),Bash(uv run ruff format *),Bash(gh pr view),Bash(gh pr view *),Bash(gh pr diff),Bash(gh pr diff *),Bash(gh pr checks),Bash(gh pr checks *),Bash(gh issue view *),Bash(gh issue list),Bash(gh issue list *),Bash(gh run view *),Bash(gh run list),Bash(gh run list *)"

